<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>…</title>
    <style>
        :root {
            color-scheme: light dark;
            --canvas: #f6f5ef;
            --surface: #fffefa;
            --surface-muted: #f8f7f2;
            --line: #dedfd4;
            --line-strong: #b6bdb0;
            --ink: #1b2823;
            --muted: #59645a;
            --accent: #26604b;
            --accent-hover: #174735;
            --on-accent: #ffffff;
            --focus: #286e54;
            --panel-shadow: 0 1px 2px #283b2710, 0 12px 26px #283b2707;
            font-family: "Avenir Next", "PingFang SC", "Segoe UI", system-ui, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --canvas: #141c18;
                --surface: #1e2923;
                --surface-muted: #24312a;
                --line: #39473e;
                --line-strong: #697d70;
                --ink: #f3f3e8;
                --muted: #bdc8bb;
                --accent: #a6d7b7;
                --accent-hover: #c7ecd4;
                --on-accent: #112b20;
                --focus: #a5deb7;
                --panel-shadow: 0 12px 30px #0002;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-size: 15px;
            line-height: 1.55;
            background: var(--canvas);
            color: var(--ink);
        }
        main, noscript {
            display: block;
            width: min(480px, 100%);
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: var(--surface);
            box-shadow: var(--panel-shadow);
        }
        h1 { margin: 0 0 12px; font-size: 22px; font-weight: 700; line-height: 1.3; }
        p { margin: 0 0 18px; color: var(--muted); }
        a, button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 39px;
            margin: 0 8px 8px 0;
            padding: 7px 14px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--surface);
            color: var(--accent);
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        a:hover, button:hover { border-color: var(--line-strong); background: var(--surface-muted); }
        #target {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--on-accent);
        }
        #target:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
        noscript a {
            display: inline;
            min-height: 0;
            margin: 0;
            padding: 0;
            border: 0;
            background: none;
            text-decoration: underline;
        }
        noscript a:hover { background: none; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <noscript>Enable JavaScript, or <a href="../options/options.html">open homepage settings</a> · 请启用 JavaScript，或<a href="../options/options.html">打开主页设置</a>。</noscript>
    <script src="../shared/homepage.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="newtab.js"></script>
</body>
</html>
