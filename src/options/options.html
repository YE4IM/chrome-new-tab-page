<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title data-i18n="pageTitle">主页设置 · 主页新标签页</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <header class="app-header">
        <div class="shell brand">
            <img src="../../icons/kagi-48.png" width="34" height="34" alt="">
            <span data-i18n="extName">主页新标签页</span>
        </div>
    </header>

    <main class="shell workspace">
        <div class="intro">
            <h1 data-i18n="fieldsetAria">主页设置</h1>
            <p data-i18n="headerSubtitle">选择打开新标签页时显示的网站。</p>
        </div>

        <div class="settings-layout">
            <section class="panel current" id="currentSection" aria-labelledby="currentTitle" hidden>
                <h2 id="currentTitle" data-i18n="currentTitle">当前主页</h2>
                <div class="result" id="currentResult" role="status" aria-live="polite" aria-atomic="true"></div>
                <button type="button" class="btn secondary small" id="endTemporary" hidden data-i18n="endTemporary">提前结束</button>
            </section>

            <div class="mode-panel">
                <div class="tabs-art" aria-hidden="true">
                    <div class="tab-window">
                        <span class="tab-dots"></span>
                        <span class="tab-line"></span>
                        <span class="tab-content"></span>
                    </div>
                    <span class="tab-spark"></span>
                </div>
                <div class="mode-controls">
                    <label class="advanced-toggle">
                        <input type="checkbox" role="switch" id="advancedEnabled" disabled
                               aria-describedby="advancedHelp"
                               aria-controls="currentSection temporaryForm scheduleDetails previewSection">
                        <span data-i18n="advancedLabel">启用高级功能</span>
                    </label>
                    <p class="mode-description" id="advancedHelp" data-i18n="advancedHelp">设置临时主页、每周时段，并预览指定时间会打开的网站。</p>
                    <div class="status" id="advancedStatus" role="status" aria-atomic="true"></div>
                </div>
            </div>

            <form class="settings-editor" id="settingsForm" novalidate aria-busy="false">
                <fieldset id="settingsFields" disabled aria-label="主页设置" data-i18n-attr="aria-label:fieldsetAria">
                    <section class="panel homepage" aria-labelledby="baseTitle">
                        <h2 id="baseTitle" data-i18n="homepageTitle">基础主页</h2>
                        <label class="field-label" for="hp" data-i18n="homepageLabel">主页地址</label>
                        <div class="input-wrap" id="inputWrap">
                            <img class="site-icon" id="siteLogo" src="../../icons/kagi.svg" alt="" aria-hidden="true" referrerpolicy="no-referrer">
                            <input id="hp" type="text" inputmode="url" spellcheck="false" autocomplete="off" autocapitalize="off"
                                   placeholder="https://kagi.com/" aria-invalid="false" aria-describedby="hpHelp errMsg">
                        </div>
                        <p class="field-help" id="hpHelp" data-i18n="hpHelp">支持域名、内网地址和 IPv6；省略协议时使用 HTTPS，本地服务请填写 http://。</p>
                        <div class="error-msg" id="errMsg" role="alert" hidden data-i18n="errMsg">请输入有效的 HTTP 或 HTTPS 网址，例如 kagi.com 或 http://localhost:3000/。</div>

                        <div class="presets">
                            <div class="presets-label" data-i18n="presetsLabel">常用网站</div>
                            <div class="chips" id="chips" role="group" aria-label="快速填入主页地址" data-i18n-attr="aria-label:chipsAria">
                                <button type="button" class="chip" aria-pressed="false" data-icon="../../icons/kagi.svg" data-url="https://kagi.com/">
                                    <img class="chip-icon" src="../../icons/kagi.svg" alt="" aria-hidden="true">Kagi
                                </button>
                                <button type="button" class="chip" aria-pressed="false" data-icon="../../icons/google.svg" data-url="https://www.google.com/">
                                    <img class="chip-icon" src="../../icons/google.svg" alt="" aria-hidden="true">Google
                                </button>
                                <button type="button" class="chip" aria-pressed="false" data-icon="../../icons/bing.svg" data-url="https://www.bing.com/">
                                    <img class="chip-icon" src="../../icons/bing.svg" alt="" aria-hidden="true">Bing
                                </button>
                                <button type="button" class="chip" aria-pressed="false" data-icon="../../icons/duckduckgo.svg" data-url="https://duckduckgo.com/">
                                    <img class="chip-icon" src="../../icons/duckduckgo.svg" alt="" aria-hidden="true">DuckDuckGo
                                </button>
                                <button type="button" class="chip" id="customChip" aria-pressed="false">
                                    <span class="custom-icon" aria-hidden="true">+</span><span data-i18n="customChip">其他地址</span>
                                </button>
                            </div>
                        </div>
                    </section>
                </fieldset>

                <div class="schedule-editor">
                    <details class="panel schedule" id="scheduleDetails" hidden>
                        <summary><span data-i18n="weeklyTitle">每周时段</span></summary>
                        <fieldset id="scheduleFields" disabled>
                            <p class="field-help" id="scheduleHelp" data-i18n="scheduleHelp">时段按设备本地时间执行，跨午夜的时段从所选星期开始。</p>
                            <div id="rules" class="rules" aria-describedby="scheduleHelp"></div>
                            <ul id="ruleErrors" class="error-msg rule-errors" role="alert" hidden></ul>
                            <div class="actions">
                                <button type="button" class="btn secondary" id="addRule" data-i18n="addRule">添加时段</button>
                            </div>
                        </fieldset>
                    </details>

                    <div class="panel settings-footer">
                        <fieldset id="settingsActions" disabled>
                            <div class="actions form-actions">
                                <button type="button" class="btn btn-reset" id="reset" data-i18n="resetBtn">恢复默认地址</button>
                                <button type="submit" class="btn btn-save" id="save" disabled data-i18n="saveHomepage">保存主页</button>
                            </div>

                            <div class="conflict" id="scheduleConflict" hidden>
                                <p class="error-msg" role="alert" id="conflictMessage"></p>
                                <details>
                                    <summary id="conflictSummary"></summary>
                                    <p id="conflictHomepage"></p>
                                    <ul id="conflictRules"></ul>
                                </details>
                                <div class="actions">
                                    <button type="button" class="btn secondary" id="useSavedSchedule"></button>
                                    <button type="button" class="btn secondary" id="keepScheduleDraft" data-i18n="keepScheduleDraft">保留我的草稿</button>
                                </div>
                            </div>
                        </fieldset>
                        <div class="status" id="status" role="status" aria-live="polite" aria-atomic="true"></div>
                        <button type="button" class="btn btn-reset small" id="retry" hidden data-i18n="retryBtn">重新读取设置</button>
                        <div class="error-msg" id="settingsWarnings" role="status" hidden></div>
                    </div>
                </div>
            </form>

            <form class="panel" id="temporaryForm" novalidate aria-labelledby="temporaryTitle" aria-busy="false" hidden>
                <h2 id="temporaryTitle" data-i18n="temporaryTitle">临时主页</h2>
                <fieldset id="temporaryFields" disabled aria-labelledby="temporaryTitle">
                    <div class="grid">
                        <label class="control">
                            <span class="field-label" data-i18n="temporaryUrl">临时主页地址</span>
                            <input id="temporaryUrl" type="text" inputmode="url" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="https://example.com/" aria-describedby="temporaryUrlError">
                            <span class="error-msg" id="temporaryUrlError" role="alert" hidden data-i18n="errMsg">请输入有效的 HTTP 或 HTTPS 网址。</span>
                        </label>
                        <label class="control">
                            <span class="field-label" data-i18n="temporaryDuration">启用时长</span>
                            <select id="temporaryDuration" aria-describedby="temporaryEndHint">
                                <option value="1800000" data-i18n="duration30">30 分钟</option>
                                <option value="3600000" data-i18n="duration60">1 小时</option>
                                <option value="custom" data-i18n="durationCustom">指定结束时间</option>
                            </select>
                        </label>
                        <label class="control full-width" id="temporaryDateField" hidden>
                            <span class="field-label" data-i18n="temporaryDate">本地结束时间</span>
                            <input id="temporaryDate" type="datetime-local" aria-describedby="temporaryDateError temporaryEndHint">
                            <span class="error-msg" id="temporaryDateError" role="alert" hidden></span>
                        </label>
                    </div>
                    <p class="field-help" id="temporaryEndHint" hidden></p>
                    <div class="actions">
                        <button type="submit" class="btn secondary" id="startTemporary" data-i18n="startTemporary">立即启用</button>
                    </div>
                </fieldset>
                <div id="temporaryStatus" class="status" role="status" aria-live="polite" aria-atomic="true"></div>
            </form>

            <section class="panel" id="previewSection" aria-labelledby="previewTitle" hidden>
                <h2 id="previewTitle" data-i18n="previewTitle">时间预览</h2>
                <fieldset id="previewFields" disabled aria-labelledby="previewTitle">
                    <label class="control">
                        <span class="field-label" data-i18n="previewDate">本地日期和时间</span>
                        <input id="previewDate" type="datetime-local" aria-describedby="previewZone previewError">
                    </label>
                    <p id="previewZone" class="field-help"></p>
                    <div class="actions">
                        <button type="button" class="btn secondary" id="previewNow" data-i18n="previewNow">现在</button>
                        <button type="button" class="btn secondary" id="previewExpiry" hidden data-i18n="previewExpiry">临时主页到期时</button>
                    </div>
                    <p id="previewDraft" class="field-help" hidden data-i18n="previewDraft">预览未保存的更改</p>
                    <div id="previewError" class="error-msg" role="status" hidden></div>
                    <div id="previewResult" class="result" role="status" aria-live="polite" aria-atomic="true"></div>
                </fieldset>
            </section>
        </div>
    </main>

    <template id="ruleTemplate">
        <div class="rule" role="group">
            <div class="grid">
                <label class="control">
                    <span class="field-label" data-label="ruleName"></span>
                    <input type="text" data-field="name" autocomplete="off">
                </label>
                <div class="rule-actions">
                    <label class="toggle">
                        <input type="checkbox" data-field="enabled">
                        <span data-label="ruleEnabled"></span>
                    </label>
                    <button type="button" class="btn btn-reset small" data-remove data-label="removeRule"></button>
                </div>
                <fieldset class="days full-width" data-field="days">
                    <legend class="field-label" data-label="ruleDays"></legend>
                </fieldset>
                <label class="control">
                    <span class="field-label" data-label="ruleStart"></span>
                    <input type="time" data-field="start">
                </label>
                <label class="control">
                    <span class="field-label" data-label="ruleEnd"></span>
                    <input type="time" data-field="end">
                </label>
                <label class="control full-width">
                    <span class="field-label" data-label="ruleUrl"></span>
                    <input type="text" data-field="homepage" inputmode="url" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="https://example.com/">
                </label>
            </div>
        </div>
    </template>

    <script src="../shared/homepage.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="options.js"></script>
</body>
</html>
